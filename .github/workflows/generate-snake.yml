name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Check out the pinned snake generator
        uses: actions/checkout@v4
        with:
          repository: Platane/snk
          ref: v3.5.0
          path: vendor/snk

      - name: Start the snake from the right
        run: node scripts/configure-snake-generator.js vendor/snk/svg-only/dist/index.js

      - name: Generate the contribution snake
        uses: ./vendor/snk/svg-only
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Animate the post-game greeting
        run: node scripts/add-greeting.js dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

      - name: Publish the snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
